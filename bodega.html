<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0;font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body data-juego="Bodega de las Mudas 3D">
<title>Bodega de las Mudas 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: escena 3D a pantalla completa; HUD de seguridad industrial (pizarra oscura + amarillo de demarcación) flotando en las esquinas; panel de inspección como hoja lateral (abajo en móvil) */
:root{
  --panel:#141c22; --panel-2:#1d2830; --ink:#eef2f4; --muted:#9aabb5; --line:#2e3d47;
  --safety:#f2b705; --ok:#4cc77a; --bad:#ef6a5e; --ok-soft:#163a25; --bad-soft:#3d1c19;
  --sky:#a9bccb;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;touch-action:none}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--safety);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
.btn{background:var(--safety);color:#1a1400;border:0;border-radius:8px;padding:11px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--safety)}
.muted{color:var(--muted)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px}

/* HUD */
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;align-items:flex-start}
.hud > *{pointer-events:auto}
.stats{display:flex;gap:16px;padding:10px 14px;align-items:baseline;flex-wrap:wrap}
.stats div{display:grid;gap:0}
.stats small{font-family:var(--f-mono);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stats b{font-family:var(--f-mono);font-size:1.15rem;font-variant-numeric:tabular-nums}
.route{padding:10px 12px;display:grid;gap:4px;font-size:.8rem;min-width:170px}
.route li{display:flex;gap:8px;align-items:center;list-style:none}
.route ul{margin:0;padding:0;display:grid;gap:3px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--safety);flex:none}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
.side{display:grid;gap:8px;justify-items:end}
#mini{display:block;border-radius:8px;border:1px solid var(--line);background:var(--panel);width:180px;height:120px}
.zoom{display:flex;gap:6px}
.exitBtn{position:fixed;z-index:15;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;background:var(--panel);border:1.5px solid var(--bad);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:600;display:flex;gap:6px;align-items:center}
.exitBtn:hover{background:var(--bad-soft)}
.btn.danger{background:var(--bad);color:#200605}
.zoom button{width:36px;height:36px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-family:var(--f-mono)}
@media (max-width:640px){ .route{display:none} #mini{width:132px;height:88px} }

#inspect{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);z-index:5}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 76px);padding:8px 14px;font-size:.88rem;max-width:min(90vw,520px);text-align:center}

/* Joystick */
#joy{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:120px;height:120px;border-radius:50%;background:rgba(20,28,34,.55);border:1.5px solid rgba(242,183,5,.5);touch-action:none;display:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--safety);opacity:.9}
@media (pointer:coarse){ #joy{display:block} }

/* Panel de inspección */
.sheet{position:fixed;z-index:10;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(440px,calc(100vw - 24px));overflow:auto;padding:20px;display:grid;gap:14px;align-content:start;box-shadow:0 20px 50px rgba(0,0,0,.35)}
@media (max-width:640px){ .sheet{top:auto;left:12px;right:12px;width:auto;max-height:72%} }
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:.7rem;padding:3px 8px;border-radius:4px;background:#2b2508;color:var(--safety)}
.story{font-size:1rem}
.evid{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);border-left:3px solid var(--safety);padding-left:10px}
.q{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{border:1.5px solid var(--line);background:var(--panel-2);border-radius:8px;padding:9px 10px;text-align:left;display:flex;gap:8px;align-items:center;min-width:0;font-size:.9rem}
.opt:hover:not(:disabled){border-color:var(--safety)}
.opt .k{font-family:var(--f-mono);font-size:.7rem;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;background:#2b2508;color:var(--safety);flex:none}
.opt.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.fb{border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:10px}
.verdict{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.fix{background:var(--panel-2);border-radius:8px;padding:10px 12px}
.fix b{color:var(--safety)}
.hint{color:var(--safety);font-size:.92rem}
.row{display:flex;flex-wrap:wrap;gap:8px}
.npc{display:flex;gap:12px;align-items:center}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.2rem;background:#2b2508;color:var(--safety);flex:none}
.npc b{display:block;font-family:var(--f-display);font-size:1.05rem}
.npc span{font-size:.82rem}
.quote{background:#f4f6f7;color:#14212a;border-radius:12px 12px 12px 2px;padding:12px 14px;font-size:1rem}
.quote.good{background:#e3f7ea} .quote.bad{background:#fde3e0}
.quote small{display:block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:#5b6b74;margin-bottom:4px}
.sols{display:grid;gap:6px}
.sol{border:1.5px solid var(--line);background:var(--panel-2);border-radius:8px;padding:10px 12px;text-align:left;display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.sol:hover:not(:disabled){border-color:var(--safety)}
.sol .k{font-family:var(--f-mono);font-size:.7rem;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;background:#2b2508;color:var(--safety);flex:none}
.sol.is-ok{border-color:var(--ok);background:var(--ok-soft)} .sol.is-bad{border-color:var(--bad);background:var(--bad-soft)} .sol.dim{opacity:.45}
.sol:disabled{cursor:default}
.steps{display:flex;gap:6px;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.steps span{padding:2px 6px;border-radius:4px;border:1px solid var(--line)}
.steps span.on{border-color:var(--safety);color:var(--safety)}
.sat{display:grid;gap:4px;min-width:92px}
.satbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.satbar i{display:block;height:100%;background:var(--safety);transition:width .4s}

/* Pantallas */
.screen{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(10,15,19,.72);overflow:auto}
.card{max-width:720px;width:100%;padding:24px;display:grid;gap:16px}
.card h1{font-size:clamp(1.8rem,6vw,2.8rem);font-weight:800;letter-spacing:-.02em}
.card h1 span{color:var(--safety)}
.grid8{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid8 div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.82rem;color:var(--muted)}
.grid8 b{display:block;color:var(--ink);font-family:var(--f-display);font-size:.98rem}
input[type=text]{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--ink);width:100%;max-width:360px}
label.field{display:grid;gap:6px;font-weight:500}
.keys{font-size:.85rem;color:var(--muted)}
.keys kbd{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--ink)}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(2.6rem,9vw,4rem);line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:.38em;color:var(--muted);font-weight:500}
.scoreRow{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="scene"></canvas>

<button class="exitBtn" id="exitBtn" aria-label="Salir del recorrido">✕ Salir</button>
<div class="hud">
  <div style="display:grid;gap:8px;padding-top:46px">
    <div class="box stats">
      <div><small>Hallazgos</small><b id="hFound">0/8</b></div>
      <div><small>Puntos</small><b id="hPts">0</b></div>
      <div><small>Tiempo</small><b id="hTime">00:00</b></div>
      <div class="sat"><small>Satisfacción</small><b id="hSat">50 %</b><div class="satbar"><i id="hSatBar" style="width:50%"></i></div></div>
    </div>
    <div class="box route"><span class="eyebrow">Zonas por inspeccionar</span><ul id="routeList"></ul></div>
  </div>
  <div class="side">
    <canvas id="mini" width="360" height="240" aria-label="Mapa de la bodega"></canvas>
    <div class="zoom"><button id="zIn" aria-label="Acercar cámara">+</button><button id="zOut" aria-label="Alejar cámara">−</button></div>
  </div>
</div>
<div class="box toast" id="toast" hidden></div>
<button class="btn" id="inspect" hidden>Inspeccionar zona (E)</button>
<div id="joy"><div id="knob"></div></div>
<aside class="box sheet" id="sheet" hidden aria-live="polite"></aside>
<div class="screen" id="screen"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- Contenido pedagógico ---------- */
const MUDAS=[
 {id:"T",name:"Transporte",def:"Mover materiales entre zonas sin agregarles valor."},
 {id:"I",name:"Inventario",def:"Material acumulado por encima de lo necesario."},
 {id:"M",name:"Movimiento",def:"Desplazamientos y búsquedas innecesarias de las personas."},
 {id:"E",name:"Esperas",def:"Personas, equipos o vehículos detenidos esperando."},
 {id:"S",name:"Sobreproceso",def:"Hacer más de lo que el cliente pide o paga."},
 {id:"P",name:"Sobreproducción",def:"Producir o alistar antes o en más cantidad de la pedida."},
 {id:"D",name:"Defectos",def:"Errores que obligan a reprocesar, devolver o rehacer."},
 {id:"H",name:"Talento no utilizado",def:"No aprovechar ideas y habilidades del personal."}
];
const STATIONS=[
 {muda:"E",zone:"Muelle 2",pos:[-14,-15.2],title:"Camiones esperando en el muelle",
  story:"Hay tres camiones con mercancía. Solo un muelle está habilitado y el montacargas está apagado porque el único operario certificado aún no llega al turno.",
  evid:"Camión en muelle: 2 h 40 min · Cola: 2 camiones · Costo de standby: $95.000/h",
  why:"Vehículos, equipos y personas están detenidos sin agregar valor. Es tiempo de espera.",
  fix:"Agendar citas de descarga por franjas, habilitar más muelles en horas pico y formar operarios polivalentes.",
  hint:"Observa qué está quieto: el camión, el montacargas y el conductor."},
 {muda:"T",zone:"Zona temporal",pos:[13.5,-13.5],title:"El pallet que da tres vueltas",
  story:"Cada pallet recibido va del muelle a una zona temporal, de allí a control de calidad y después regresa al rack. Mira el recorrido del montacargas.",
  evid:"Recorrido por pallet: 180 m · Recorrido mínimo posible: 45 m",
  why:"Lo que se mueve es el material, de zona en zona, sin que el traslado lo transforme.",
  fix:"Inspección de calidad en el muelle y almacenamiento directo (putaway) a la ubicación final; rediseñar el layout en flujo.",
  hint:"Sigue con la vista al montacargas y cuenta las paradas."},
 {muda:"I",zone:"Pasillo 2",pos:[-13,-9],title:"Pasillo bloqueado",
  story:"El pasillo 2 está ocupado por pallets de una referencia comprada en exceso. Los montacargas deben rodear la nave para llegar a las ubicaciones del fondo.",
  evid:"Cobertura de la referencia: 94 días · Meta: 20 días · Pallets en piso: 12",
  why:"Es material almacenado por encima de lo necesario. Ocupa espacio, inmoviliza capital y obstaculiza el flujo.",
  fix:"Punto de pedido según consumo real, clasificación ABC, ubicaciones de reserva y 5S para mantener pasillos libres.",
  hint:"La causa del bloqueo es la cantidad de producto."},
 {muda:"M",zone:"Picking",pos:[-7,-9],title:"El picker que cruza toda la bodega",
  story:"El operario de alistamiento camina hasta el fondo del pasillo por las referencias que más se venden y regresa a empaque por cada pedido. Míralo caminar.",
  evid:"Distancia por turno: 14 km · 15 referencias concentran el 70 % de las líneas",
  why:"La persona hace desplazamientos innecesarios para poder trabajar. Eso es movimiento.",
  fix:"Ubicar la alta rotación cerca de despacho (slotting ABC) y alistar por lotes con rutas de picking.",
  hint:"Aquí quien recorre la distancia es una persona, no un pallet."},
 {muda:"D",zone:"Reproceso",pos:[17.5,-5],title:"Mesa de reproceso",
  story:"Los clientes devolvieron cajas con la etiqueta de otro pedido. Dos operarios pasan el turno abriendo, verificando y reetiquetando.",
  evid:"Pedidos con error de etiqueta: 6 % · Cajas en reproceso hoy: 48",
  why:"Un error obliga a rehacer el trabajo y genera devoluciones. Es un defecto.",
  fix:"Escaneo de verificación antes de cerrar la caja (poka-yoke) y etiqueta impresa automáticamente desde el pedido.",
  hint:"Las cajas rojas regresaron del cliente."},
 {muda:"S",zone:"Empaque",pos:[19.6,9],title:"Triple película y doble etiqueta",
  story:"En empaque cada pallet se envuelve con tres capas de película estirable y lleva dos etiquetas. El cliente pidió una capa y una etiqueta.",
  evid:"Consumo de película: 3 veces el estándar · 4 min extra por pallet",
  why:"Se hace más trabajo del que el cliente requiere y paga. Es sobreproceso.",
  fix:"Estándar de empaque por cliente con instrucción visual en la estación.",
  hint:"Compara lo que se hace con lo que el cliente pidió."},
 {muda:"P",zone:"Despacho",pos:[10,12],title:"Pedidos que nadie ha confirmado",
  story:"Para adelantar trabajo, el turno de la noche alistó los pedidos de la próxima semana. No están confirmados y ocupan toda la zona de despacho.",
  evid:"Pallets alistados sin orden: 22 · Pedidos cancelados el mes pasado: 18 %",
  why:"Se alistó antes y en más cantidad de lo pedido. Es sobreproducción, y genera inventario y reprocesos si cancelan.",
  fix:"Alistar solo contra orden confirmada (sistema pull) y nivelar la carga de trabajo por día.",
  hint:"El problema empezó cuando se trabajó antes de tiempo."},
 {muda:"H",zone:"Tablero",pos:[-24,16.3],title:"El tablero de ideas vacío",
  story:"Un montacarguista con 10 años de experiencia propuso reubicar la alta rotación. Hoy está barriendo y el tablero de mejoras sigue vacío desde enero.",
  evid:"Ideas de mejora registradas en el año: 0 · Rotación de personal: 32 %",
  why:"No se aprovechan el conocimiento ni las ideas de quienes hacen el trabajo.",
  fix:"Reunión diaria de 10 minutos, tablero kaizen con seguimiento y reconocimiento a las ideas implementadas.",
  hint:"Mira a la persona y lo que sabe hacer."}
];

/* ---------- Estado ---------- */
/* Personajes: queja, frase corta del globo y soluciones (la primera es la correcta; se barajan al mostrar) */
const TALK={
 E:{name:"Don Jairo",role:"Conductor del camión",short:"¡2 h 40 min esperando para descargar!",
  say:"Llevo 2 h 40 min con el camión parqueado. El montacargas está ahí, pero el operario certificado no ha llegado. A mí me pagan por viaje, no por esperar.",
  sol:[{t:"Agendar citas de descarga por franjas y formar operarios polivalentes para el montacargas.",r:"Si me dan una hora fija y alguien que descargue, salgo en 40 minutos."},
       {t:"Pedir a los conductores que lleguen más temprano.",r:"¿Más temprano? Entonces esperaría todavía más."},
       {t:"Cobrarle al transportador el tiempo de espera.",r:"¿A mí? Si el problema es que aquí nadie descarga..."}]},
 T:{name:"Wilson",role:"Montacarguista",short:"Muelle, temporal, calidad... ¡otra vuelta!",
  say:"Cada pallet lo muevo tres veces antes de que llegue al rack: muelle, zona temporal, calidad y de vuelta. Gasto combustible y tiempo, y el pallet sigue igual.",
  sol:[{t:"Inspeccionar en el muelle y almacenar directo en la ubicación final (putaway directo).",r:"Un solo viaje por pallet. Así sí rinde el turno."},
       {t:"Comprar un montacargas más rápido.",r:"Daría las mismas vueltas, solo que más rápido y con más riesgo."},
       {t:"Agregar otra zona temporal más cerca del muelle.",r:"Sería otra parada más en el recorrido."}]},
 I:{name:"Yesid",role:"Auxiliar de inventarios",short:"¡No puedo pasar por el pasillo 2!",
  say:"Para llegar a las ubicaciones del fondo tengo que rodear toda la nave. Ese producto lleva 94 días ahí y compras sigue pidiendo más.",
  sol:[{t:"Definir el punto de pedido según el consumo real, aplicar clasificación ABC y mantener pasillos libres con 5S.",r:"Si compramos lo que se consume, el pasillo queda libre."},
       {t:"Arrendar otra bodega para el sobrestock.",r:"Pagaríamos arriendo por guardar lo que no vendemos."},
       {t:"Apilar los pallets más alto para que ocupen menos piso.",r:"¡Eso es peligroso! Y el exceso sigue ahí."}]},
 M:{name:"Nelson",role:"Operario de picking",short:"¡Otra vez hasta el fondo!",
  say:"Las referencias que más se venden están al fondo del pasillo. Por cada pedido camino hasta allá y vuelvo. Termino el turno con 14 km encima.",
  sol:[{t:"Ubicar la alta rotación cerca de despacho (slotting ABC) y alistar por lotes con rutas.",r:"¡Lo que más sale, a la mano! Así hago el doble de pedidos."},
       {t:"Darle una bicicleta para moverse más rápido.",r:"Llegaría antes, pero seguiría yendo al fondo cada vez."},
       {t:"Contratar otro picker para repartir los pedidos.",r:"Seríamos dos caminando 14 km."}]},
 D:{name:"Sandra",role:"Auxiliar de devoluciones",short:"48 cajas para reetiquetar...",
  say:"Los clientes devolvieron cajas con la etiqueta de otro pedido. Llevamos todo el turno abriendo, verificando y reetiquetando. Y mañana llegan más.",
  sol:[{t:"Escanear cada caja contra el pedido antes de cerrarla (poka-yoke) e imprimir la etiqueta desde el sistema.",r:"Si el escáner no deja cerrar la caja equivocada, el error no sale de la bodega."},
       {t:"Poner más personas en la mesa de reproceso.",r:"Corregiríamos más rápido, pero los errores seguirían llegando."},
       {t:"Revisar solo las cajas de los clientes que se quejan.",r:"Los demás también reciben errores; solo que no llaman."}]},
 S:{name:"Óscar",role:"Empacador",short:"Tres capas, dos etiquetas...",
  say:"Me dijeron que envolviera cada pallet con tres capas y dos etiquetas, por si acaso. El cliente pidió una sola capa. Gasto el triple de película.",
  sol:[{t:"Definir un estándar de empaque por cliente con una instrucción visual en la estación.",r:"Con la ficha del cliente a la vista, hago solo lo que pide."},
       {t:"Comprar película más gruesa.",r:"Seguiríamos envolviendo de más, y más caro."},
       {t:"Envolver más rápido para compensar.",r:"El problema no es la velocidad; es la capa que sobra."}]},
 P:{name:"Claudia",role:"Supervisora de despacho",short:"¿Y si cancelan estos pedidos?",
  say:"El turno de la noche alistó los pedidos de la próxima semana para adelantar trabajo. No están confirmados y ya no tengo dónde poner los despachos de hoy.",
  sol:[{t:"Alistar solo contra pedido confirmado (sistema pull) y nivelar la carga de trabajo por día.",r:"Así la zona de despacho queda libre para lo de hoy."},

function animHuman(h,dt,speed,mode="walk"){
  h.phase+=dt*(mode==="walk"?speed*1.6:3);

}

  addCollider(x,(z0+z1)/2,depth+0.2,len+0.2);
}

function resolve(p,r){
  for(const b of colliders){
    const cx=clamp(p.x,b.minX,b.maxX),cz=clamp(p.z,b.minZ,b.maxZ);
    const dx=p.x-cx,dz=p.z-cz,d2=dx*dx+dz*dz;
    if(d2<r*r){
      if(d2>1e-8){const d=Math.sqrt(d2);p.x=cx+dx/d*r;p.z=cz+dz/d*r;}
      else{const opts=[[b.minX-r-p.x,0],[b.maxX+r-p.x,0],[0,b.minZ-r-p.z],[0,b.maxZ+r-p.z]].sort((a,c)=>Math.abs(a[0]+a[1])-Math.abs(c[0]+c[1]));p.x+=opts[0][0];p.z+=opts[0][1];}

function moveAlong(obj,path,state,speed,dt,stops){
  // devuelve verdadero si se mueve
  if(state.wait>0){state.wait-=dt;return false;}
  const a=path[state.seg],b=path[(state.seg+1)%path.length];
  const len=Math.hypot(b[0]-a[0],b[1]-a[1]);state.t+=speed*dt/len;
  if(state.t>=1){state.t=0;state.seg=(state.seg+1)%path.length;if(stops&&stops.has(state.seg))state.wait=1.4;}
  const p=path[state.seg],q=path[(state.seg+1)%path.length],t=state.t;
  obj.position.set(p[0]+(q[0]-p[0])*t,0,p[1]+(q[1]-p[1])*t);
  obj.rotation.y=Math.atan2(q[0]-p[0],q[1]-p[1]);return true;
}

    <div class="grid8">${MUDAS.map(m=>`<div><b>${m.name}</b>${m.def}</div>`).join("")}</div>
    <label class="field" for="pname">Nombre del estudiante o grupo<input type="text" id="pname" placeholder="Ej.: Grupo 2 – Logística" value="${esc(G.player)}"${window.GATE_NAME?" readonly":""}></label>${window.GATE_NAME?`<p class="muted" style="font-size:.85rem">Acceso aprobado por el docente para ${esc(window.GATE_NAME)}.</p>`:""}
    <p class="keys">Muévete con <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> o las flechas (en celular, con el joystick). <kbd>E</kbd> inspecciona, <kbd>1</kbd>–<kbd>8</kbd> responde, rueda del mouse o <kbd>+</kbd>/<kbd>−</kbd> para el zoom.</p>
    <div class="row"><button class="btn" id="startBtn">Entrar a la bodega</button></div></div>`;
  $("startBtn").onclick=()=>{G.player=$("pname").value.trim();$("screen").hidden=true;G.started=true;G.startedAt=new Date();toast("Busca los anillos amarillos. Observa el muelle, los pasillos y la banda transportadora.",5);canvas.focus?.();};
}
/* Nombre fijado por el control de acceso (solo en la versión con aprobación) */
window.onGateApproved=name=>{G.player=name;if(!G.started&&!G.ended)startScreen();};
function endGame(){
  G.ended=true;$("inspect").hidden=true;
  const s=score(),nota=(s/160*5).toFixed(1),okM=STATIONS.filter(st=>(G.results[st.muda]||{}).ok).length,okS=STATIONS.filter(st=>(G.results[st.muda]||{}).solOk).length,early=!allDone();
  const miss=STATIONS.filter(st=>!(G.results[st.muda]||{}).ok||!(G.results[st.muda]||{}).solOk);
  const mark=b=>`<span style="color:var(--${b?"ok":"bad"})">${b?"Acertó":"Falló"}</span>`,none=`<span class="muted">Sin responder</span>`;
  $("screen").hidden=false;
  $("screen").innerHTML=`<div class="box card">
    <p class="eyebrow">Inspección terminada${G.player?" · "+esc(G.player):""}</p>
    <h1>Informe de <span>hallazgos</span></h1>
    ${early?`<p class="hint">Saliste antes de terminar: completaste ${doneCount()} de 8 puestos. Los puestos sin responder cuentan 0 puntos.</p>`:""}
    <div class="scoreRow">
      <div><p class="muted">Nota</p><p class="big">${nota}<small> / 5,0</small></p></div>
      <div><p class="muted">Puntos</p><p class="big" style="font-size:2rem">${s}<small> / 160</small></p></div>
      <div><p class="muted">Mudas</p><p class="big" style="font-size:2rem">${okM}<small> de 8</small></p></div>
      <div><p class="muted">Soluciones</p><p class="big" style="font-size:2rem">${okS}<small> de 8</small></p></div>
      <div><p class="muted">Satisfacción</p><p class="big" style="font-size:2rem">${Math.round(G.sat)}<small> %</small></p></div>
      <div><p class="muted">Tiempo</p><p class="big" style="font-size:2rem">${fmt(G.elapsed)}</p></div>
    </div>
    <div class="tablewrap"><table><thead><tr><th>Puesto</th><th>Persona</th><th>Muda</th><th>Tu respuesta</th><th>Solución</th></tr></thead><tbody>
    ${STATIONS.map(st=>{const r=G.results[st.muda];return `<tr><td>${esc(st.zone)}</td><td>${esc(TALK[st.muda].name)}</td><td>${mudaById(st.muda).name}</td><td>${!r?none:mark(r.ok)+(r.ok?"":" ("+mudaById(r.picked).name+")")}</td><td>${!r||r.sol==null?none:mark(r.solOk)}</td></tr>`;}).join("")}
    </tbody></table></div>
    ${miss.length?`<div style="display:grid;gap:8px"><h3>Para repasar</h3>${miss.map(m=>`<p class="muted"><b style="color:var(--ink)">${esc(m.zone)}:</b> ${esc(m.why)} <i>Solución:</i> ${esc(TALK[m.muda].sol[0].t)}</p>`).join("")}</div>`:""}
    <p class="muted" style="font-size:.85rem" id="dlMsg">Descarga el detalle de tu calificación (se abre en Excel) para entregarlo al docente.</p>
    <div class="row"><button class="btn" id="dlBtn" disabled>Preparando descarga…</button><button class="btn ghost" id="homeBtn">Volver al inicio</button><button class="btn ghost" id="again">Recorrer de nuevo</button></div></div>`;
  $("again").onclick=restart;$("homeBtn").onclick=goHome;
  setupDownload();
}

/* ---------- Descarga del detalle de calificación ---------- */
const GAME_NAME="Bodega";
function csvCell(v){v=v==null?"":String(v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
const dec=n=>String(n).replace(".",",");
const two=n=>String(n).padStart(2,"0");
const fdate=d=>d?`${d.getFullYear()}-${two(d.getMonth()+1)}-${two(d.getDate())}`:"";
const ftime=d=>d?`${two(d.getHours())}:${two(d.getMinutes())}:${two(d.getSeconds())}`:"";
function buildCSV(){
  const end=new Date(),s=score(),nota=(s/160*5).toFixed(1);
  const okM=STATIONS.filter(st=>G.results[st.muda]&&G.results[st.muda].ok).length;
  const okS=STATIONS.filter(st=>G.results[st.muda]&&G.results[st.muda].solOk).length;
  const L=[];const row=a=>L.push(a.map(csvCell).join(";"));
  row(["DETALLE DE CALIFICACIÓN",GAME_NAME]);
  row(["Estudiante o grupo",G.player||"Sin nombre"]);
  row(["Fecha",fdate(G.startedAt||end)]);
  row(["Hora de inicio",ftime(G.startedAt)]);
  row(["Hora de finalización",ftime(end)]);
  row(["Duración (mm:ss)",fmt(G.elapsed)]);
  row(["Estado",allDone()?"Recorrido completo":"Salió antes de terminar ("+doneCount()+" de 8 puestos)"]);
  row(["Nota (0 a 5)",dec(nota)]);
  row(["Puntos",s+" de 160"]);
  row(["Mudas identificadas",okM+" de 8"]);
  row(["Soluciones correctas",okS+" de 8"]);
  row(["Satisfacción final (%)",Math.round(G.sat)]);
  row(["Puntaje","Muda: 10 pts (7 con pista) · Solución: 10 pts"]);
  row([]);
  row(["N.° orden","Puesto o zona","Persona","Situación","Muda correcta","Respuesta del estudiante","¿Acertó muda?","¿Usó pista?","Puntos muda","Solución elegida","Solución correcta","¿Acertó solución?","Puntos solución","Puntos totales","Momento de respuesta (mm:ss)","Explicación"]);
  STATIONS.map(st=>({st,r:G.results[st.muda]})).sort((a,b)=>((a.r&&a.r.order)||99)-((b.r&&b.r.order)||99)).forEach(({st,r})=>{
    const T=TALK[st.muda];
    if(!r){row(["—",st.zone,T.name,st.title,mudaById(st.muda).name,"Sin responder","No","",0,"",T.sol[0].t,"No",0,0,"",st.why]);return;}
    const pm=r.ok?(r.hint?7:10):0,ps=r.solOk?10:0;
    row([r.order,st.zone,T.name,st.title,mudaById(st.muda).name,mudaById(r.picked).name,r.ok?"Sí":"No",r.hint?"Sí":"No",pm,
         r.sol!=null?T.sol[r.sol].t:"Sin responder",T.sol[0].t,r.solOk?"Sí":"No",ps,pm+ps,fmt(r.tSol!=null?r.tSol:r.tMuda),st.why]);
  });
  return "﻿"+L.join("\r\n");
}
function fileName(){
  const who=(G.player||"estudiante").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,40)||"estudiante";
  const d=G.startedAt||new Date();
  return `calificacion_${GAME_NAME.toLowerCase().replace(/[^a-z0-9]+/g,"_")}_${who}_${fdate(d)}_${two(d.getHours())}${two(d.getMinutes())}.csv`;
}
let downloadsNS;
const dlReady=(async()=>{try{downloadsNS=window.claude&&window.claude.use?await window.claude.use("downloads"):null;}catch(e){downloadsNS=null;}return downloadsNS;})();
async function setupDownload(){
  const btn=$("dlBtn"),msg=$("dlMsg");if(!btn)return;
  const ns=await dlReady;
  if(!$("dlBtn"))return;
  if(ns){
    btn.disabled=false;btn.textContent="Descargar calificación (Excel)";
    btn.onclick=async()=>{
      btn.disabled=true;
      try{await ns.save({filename:fileName(),data:buildCSV()});msg.textContent="Archivo descargado. Entrégalo al docente.";btn.textContent="Descargar de nuevo";}
      catch(e){const c=e&&e.code;
        if(c==="declined")msg.textContent="Cancelaste la descarga. Puedes intentarlo de nuevo.";
        else if(c==="rate_limited")msg.textContent="Ya hay una descarga pendiente de confirmar. Espera un momento.";
        else{msg.textContent="La descarga no está disponible aquí. Usa el botón para copiar el detalle y pégalo en Excel.";useCopy(btn,msg);return;}
      }
      btn.disabled=false;
    };
  }else if(!window.claude)useFileDownload(btn,msg);
  else useCopy(btn,msg);
}
function useFileDownload(btn,msg){
  btn.disabled=false;btn.textContent="Descargar calificación (Excel)";
  btn.onclick=()=>{
    try{
      const url=URL.createObjectURL(new Blob([buildCSV()],{type:"text/csv;charset=utf-8"}));
      const a=document.createElement("a");a.href=url;a.download=fileName();document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      msg.textContent="Archivo descargado. Entrégalo al docente.";btn.textContent="Descargar de nuevo";
    }catch(e){useCopy(btn,msg);}
  };
}
function useCopy(btn,msg){
  btn.disabled=false;btn.textContent="Copiar detalle para Excel";
  msg.textContent="La descarga no está disponible en este navegador. Copia el detalle y pégalo en una hoja de Excel.";
  btn.onclick=async()=>{
    const tsv=buildCSV().replace(/^﻿/,"").split("\r\n").map(l=>l.replace(/;/g,"\t")).join("\n");
    try{await navigator.clipboard.writeText(tsv);msg.textContent="Detalle copiado. Pégalo en Excel con Ctrl+V.";}
    catch(e){let ta=$("dlText");if(!ta){ta=document.createElement("textarea");ta.id="dlText";ta.readOnly=true;ta.style.cssText="width:100%;height:140px;font:12px var(--f-mono);background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px";msg.after(ta);}
      ta.value=tsv;ta.focus();ta.select();msg.textContent="Selecciona el texto (ya está marcado), cópialo y pégalo en Excel.";}
  };
}


/* ---------- Salir ---------- */
function restart(){G.results={};G.ended=false;G.elapsed=0;G.sat=50;STATIONS.forEach(s=>{s.prompted=false;s.order=null;s.ring.material.color.setHex(0xf2b705);s.gem.material.color.setHex(0xf2b705);s.gem.material.emissive.setHex(0x5a4200);});player.pos.set(2,0,-12);camTarget.copy(player.pos);$("hTime").textContent="00:00";updateHUD();$("screen").hidden=true;G.started=true;G.startedAt=new Date();}
function goHome(){restart();G.started=false;startScreen();}
function askExit(){
  if(!G.started||G.ended)return;
  if(G.open!==null){$("sheet").hidden=true;G.open=null;}
  G.started=false;$("inspect").hidden=true;
  const n=doneCount();
  $("screen").hidden=false;
  $("screen").innerHTML=`<div class="box card" role="dialog" aria-labelledby="exitTitle">
    <p class="eyebrow">Recorrido en pausa</p>
    <h1 id="exitTitle" style="font-size:clamp(1.6rem,5vw,2.2rem)">¿Quieres <span>salir</span>?</h1>
    <p class="muted">Llevas ${n} de 8 puestos completos y ${score()} puntos. Si terminas ahora, los puestos sin responder cuentan 0 puntos.</p>
    <div class="row">
      <button class="btn" id="exFinish">Terminar y ver mi calificación</button>
      <button class="btn ghost" id="exHome">Salir sin calificación (volver al inicio)</button>
      <button class="btn ghost" id="exStay">Seguir jugando</button>
    </div></div>`;
  $("exFinish").onclick=()=>{G.started=true;endGame();};
  $("exHome").onclick=goHome;
  $("exStay").onclick=()=>{$("screen").hidden=true;G.started=true;};
  $("exStay").focus();
}
$("exitBtn").onclick=askExit;

updateHUD();camTarget.copy(player.pos);startScreen();loop();
</script>

<script src="config.js"></script>
<script src="gate.js"></script>
</body>
