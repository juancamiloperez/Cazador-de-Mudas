<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<body data-juego="Oficina Financiera 3D">
<title>Oficina Financiera de las Mudas 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: escena 3D a pantalla completa de una oficina de contabilidad y tesorería; HUD oscuro tipo terminal financiera con acento verde billete; panel de inspección lateral (abajo en móvil) */
[hidden]{display:none!important}
:root{
  --panel:#121a1f; --panel-2:#1b262d; --ink:#edf2f3; --muted:#98aab2; --line:#2c3b44;
  --acc:#46d39a; --acc-ink:#062417; --acc-soft:#173a2c;
  --ok:#4cc77a; --bad:#ef6a5e; --ok-soft:#163a25; --bad-soft:#3d1c19; --hint:#f2c14e;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:#c3ccd2;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;touch-action:none}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:8px;padding:11px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.muted{color:var(--muted)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;align-items:flex-start}
.hud > *{pointer-events:auto}
.stats{display:flex;gap:16px;padding:10px 14px;align-items:baseline;flex-wrap:wrap}
.stats div{display:grid}
.stats small{font-family:var(--f-mono);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stats b{font-family:var(--f-mono);font-size:1.15rem;font-variant-numeric:tabular-nums}
.route{padding:10px 12px;display:grid;gap:4px;font-size:.8rem;min-width:180px}
.route ul{margin:0;padding:0;display:grid;gap:3px}
.route li{display:flex;gap:8px;align-items:center;list-style:none}
.dot{width:9px;height:9px;border-radius:50%;background:#f2b705;flex:none}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
.side{display:grid;gap:8px;justify-items:end}
#mini{display:block;border-radius:8px;border:1px solid var(--line);background:var(--panel);width:180px;height:120px}
.zoom{display:flex;gap:6px}
.exitBtn{position:fixed;z-index:15;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;background:var(--panel);border:1.5px solid var(--bad);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:600;display:flex;gap:6px;align-items:center}
.exitBtn:hover{background:var(--bad-soft)}
.btn.danger{background:var(--bad);color:#200605}
.zoom button{width:36px;height:36px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-family:var(--f-mono)}
@media (max-width:640px){ .route{display:none} #mini{width:132px;height:88px} }
#inspect{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);z-index:5}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 76px);padding:8px 14px;font-size:.88rem;max-width:min(90vw,540px);text-align:center}
#joy{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);width:120px;height:120px;border-radius:50%;background:rgba(18,26,31,.55);border:1.5px solid rgba(70,211,154,.55);touch-action:none;display:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--acc);opacity:.9}
@media (pointer:coarse){ #joy{display:block} }
.sheet{position:fixed;z-index:10;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(440px,calc(100vw - 24px));overflow:auto;padding:20px;display:grid;gap:14px;align-content:start;box-shadow:0 20px 50px rgba(0,0,0,.35)}
@media (max-width:640px){ .sheet{top:auto;left:12px;right:12px;width:auto;max-height:72%} }
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:.7rem;padding:3px 8px;border-radius:4px;background:var(--acc-soft);color:var(--acc)}
.evid{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);border-left:3px solid var(--acc);padding-left:10px}
.q{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{border:1.5px solid var(--line);background:var(--panel-2);border-radius:8px;padding:9px 10px;text-align:left;display:flex;gap:8px;align-items:center;min-width:0;font-size:.9rem}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt .k{font-family:var(--f-mono);font-size:.7rem;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);flex:none}
.opt.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.fb{border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:10px}
.verdict{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.fix{background:var(--panel-2);border-radius:8px;padding:10px 12px}
.fix b{color:var(--acc)}
.hint{color:var(--hint);font-size:.92rem}
.row{display:flex;flex-wrap:wrap;gap:8px}
.npc{display:flex;gap:12px;align-items:center}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.2rem;background:var(--acc-soft);color:var(--acc);flex:none}
.npc b{display:block;font-family:var(--f-display);font-size:1.05rem}
.npc span{font-size:.82rem}
.quote{background:#f4f6f7;color:#14212a;border-radius:12px 12px 12px 2px;padding:12px 14px;font-size:1rem;position:relative}
.quote.good{background:#e3f7ea} .quote.bad{background:#fde3e0}
.quote small{display:block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:#5b6b74;margin-bottom:4px}
.sols{display:grid;gap:6px}
.sol{border:1.5px solid var(--line);background:var(--panel-2);border-radius:8px;padding:10px 12px;text-align:left;display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.sol:hover:not(:disabled){border-color:var(--acc)}
.sol .k{font-family:var(--f-mono);font-size:.7rem;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);flex:none}
.sol.is-ok{border-color:var(--ok);background:var(--ok-soft)} .sol.is-bad{border-color:var(--bad);background:var(--bad-soft)} .sol.dim{opacity:.45}
.sol:disabled{cursor:default}
.steps{display:flex;gap:6px;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.steps span{padding:2px 6px;border-radius:4px;border:1px solid var(--line)}
.steps span.on{border-color:var(--acc);color:var(--acc)}
.sat{display:grid;gap:4px;min-width:92px}
.satbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.satbar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.screen{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(9,14,17,.72);overflow:auto}
.card{max-width:720px;width:100%;padding:24px;display:grid;gap:16px}
.card h1{font-size:clamp(1.8rem,6vw,2.8rem);font-weight:800;letter-spacing:-.02em}
.card h1 span{color:var(--acc)}
.grid8{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid8 div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.82rem;color:var(--muted)}
.grid8 b{display:block;color:var(--ink);font-family:var(--f-display);font-size:.98rem}
input[type=text]{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--ink);width:100%;max-width:360px}
label.field{display:grid;gap:6px;font-weight:500}
.keys{font-size:.85rem;color:var(--muted)}
.keys kbd{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--ink)}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(2.6rem,9vw,4rem);line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:.38em;color:var(--muted);font-weight:500}
.scoreRow{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
</style>

<canvas id="scene"></canvas>
<button class="exitBtn" id="exitBtn" aria-label="Salir del recorrido">✕ Salir</button>
<div class="hud">
  <div style="display:grid;gap:8px;padding-top:46px">
    <div class="box stats">
      <div><small>Hallazgos</small><b id="hFound">0/8</b></div>
      <div><small>Puntos</small><b id="hPts">0</b></div>
      <div><small>Tiempo</small><b id="hTime">00:00</b></div>
      <div class="sat"><small>Satisfacción</small><b id="hSat">50 %</b><div class="satbar"><i id="hSatBar" style="width:50%"></i></div></div>
    </div>
    <div class="box route"><span class="eyebrow">Puestos por auditar</span><ul id="routeList"></ul></div>
  </div>
  <div class="side">
    <canvas id="mini" width="360" height="240" aria-label="Plano de la oficina"></canvas>
    <div class="zoom"><button id="zIn" aria-label="Acercar cámara">+</button><button id="zOut" aria-label="Alejar cámara">−</button></div>
  </div>
</div>
<div class="box toast" id="toast" hidden></div>
<button class="btn" id="inspect" hidden>Auditar puesto (E)</button>
<div id="joy"><div id="knob"></div></div>
<aside class="box sheet" id="sheet" hidden aria-live="polite"></aside>
<div class="screen" id="screen"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- Contenido ---------- */
const MUDAS=[
 {id:"T",name:"Transporte",def:"Mover documentos o información entre áreas sin agregar valor."},
 {id:"I",name:"Inventario",def:"Facturas, trámites o archivos acumulados en papel o digital."},
 {id:"M",name:"Movimiento",def:"Desplazamientos y búsquedas innecesarias de las personas."},
 {id:"E",name:"Esperas",def:"Trámites detenidos por una firma, un sistema o un turno."},
 {id:"S",name:"Sobreproceso",def:"Pasos, firmas o digitaciones que nadie necesita."},
 {id:"P",name:"Sobreproducción",def:"Informes, copias o envíos de más o antes de tiempo."},
 {id:"D",name:"Defectos",def:"Errores que obligan a reversar, corregir o rehacer."},
 {id:"H",name:"Talento no utilizado",def:"No aprovechar ideas y habilidades del equipo."}
];
const STATIONS=[
 {muda:"E",zone:"Oficina del director",pos:[-15,-6.4],title:"La bandeja del director",
  story:"Hay 37 facturas revisadas por contabilidad esperando la firma del director. Está de vacaciones y no dejó delegado. Afuera, una persona de tesorería espera para llevarlas a pago.",
  evid:"Espera promedio: 6 días · Descuentos por pronto pago en riesgo: $8,4 millones",
  why:"Nadie trabaja sobre las facturas; están detenidas esperando una firma. Es tiempo de espera.",
  fix:"Delegación automática de aprobaciones durante ausencias, topes por monto y alerta cuando una factura supera 48 horas.",
  hint:"Las facturas no se mueven ni se corrigen: solo están quietas."},
 {muda:"I",zone:"Radicación",pos:[-13.4,-2],title:"Radicación desbordada",
  story:"El escritorio de radicación y el piso alrededor están llenos de facturas sin radicar. Algunas llevan tres semanas y ya bloquean el paso.",
  evid:"Facturas pendientes: 140 · La más antigua: 21 días",
  why:"Es trabajo acumulado esperando turno: inventario en proceso, aunque sea papel o correo.",
  fix:"Radicación diaria con meta de cero facturas de más de 48 horas, factura electrónica y tablero visible del pendiente.",
  hint:"Fíjate en la cantidad acumulada, no en quién la mueve."},
 {muda:"T",zone:"Mensajería interna",pos:[14.6,0.6],title:"La carpeta que recorre la oficina",
  story:"Cada factura física viaja en el carrito del mensajero: de radicación a compras, de compras a contabilidad, a auditoría y de regreso. Sigue el carrito con la mirada.",
  evid:"4 traslados por factura · 2 días solo en mensajería interna",
  why:"Lo que se mueve es el documento, de un área a otra, sin que el traslado lo transforme.",
  fix:"Un único punto de radicación digital y flujo de aprobación dentro del ERP; la factura no vuelve a viajar en papel.",
  hint:"Observa qué se desplaza: ¿la persona o las carpetas?"},
 {muda:"D",zone:"Causación",pos:[-4,0.2],title:"La bandeja de reversiones",
  story:"Una de cada diez facturas se causa con la tarifa de retención en la fuente equivocada. La bandeja roja está llena de comprobantes que hay que reversar y volver a causar.",
  evid:"Notas de reversión del mes: 31 · Riesgo de sanción tributaria",
  why:"El error obliga a reversar y rehacer el registro. Es un defecto.",
  fix:"Parametrizar la tarifa por proveedor y concepto en el ERP y usar lista de chequeo antes de contabilizar.",
  hint:"¿Qué pasa con el comprobante después del error?"},
 {muda:"S",zone:"Conciliación bancaria",pos:[5.2,0.2],title:"Imprimir para volver a digitar",
  story:"Para conciliar, la analista descarga el extracto del banco, lo imprime y lo vuelve a digitar en Excel para cruzarlo con el auxiliar contable. La impresora no para.",
  evid:"Movimientos digitados a mano al mes: ~2.400",
  why:"La información ya es digital. Imprimirla y volverla a digitar son pasos que no agregan valor.",
  fix:"Importar el extracto en formato plano al módulo de conciliación del ERP con reglas de cruce automático.",
  hint:"Cuenta los pasos que sobran entre el banco y el auxiliar."},
 {muda:"P",zone:"Sala de juntas",pos:[13.6,-6.4],title:"El informe que nadie lee",
  story:"En la sala de juntas hay un informe de flujo de caja de 25 páginas en cada puesto. Se prepara todos los días. La gerencia solo mira el saldo final y el resto termina en la papelera.",
  evid:"40 h al mes elaborándolo · Páginas consultadas: 1 de 25",
  why:"Se produce más de lo que el cliente interno necesita. Es sobreproducción.",
  fix:"Acordar con la gerencia un tablero de una página con el saldo y las alertas que sí usa.",
  hint:"El problema es cuánto se produce."},
 {muda:"M",zone:"Contador",pos:[-3,8.4],title:"El contador y la impresora del fondo",
  story:"El contador imprime cada soporte en la impresora compartida del otro extremo y después va al archivo a buscar el comprobante anterior. Míralo caminar de ida y vuelta.",
  evid:"Desplazamientos al día: ~15 · 1,2 km por jornada",
  why:"Es la persona la que camina y busca para poder trabajar. Eso es movimiento.",
  fix:"Soportes digitales consultables desde el puesto, impresora cercana solo para lo indispensable y archivo digital indexado.",
  hint:"Aquí quien recorre la distancia es una persona."},
 {muda:"H",zone:"Analista de cuentas",pos:[8.4,8.4],title:"Power BI digitando facturas",
  story:"La analista tiene certificación en Power BI y Excel avanzado (el diploma está en la pared), pero pasa el 70 % de la jornada digitando facturas a mano. El tablero de ideas está vacío.",
  evid:"110 h al mes en digitación · Ideas de mejora registradas: 0",
  why:"Su capacidad para automatizar y analizar no se aprovecha. Es talento no utilizado.",
  fix:"Asignarle la automatización de la carga de facturas y el tablero de tesorería; abrir un canal de ideas con seguimiento.",
  hint:"Compara lo que la persona sabe hacer con lo que hace."}
];

/* Personajes: queja inicial, frase corta en el globo y soluciones (la primera es la correcta; se barajan al mostrar) */
const TALK={
 E:{name:"Laura",role:"Tesorería",short:"¿Alguien que pueda firmar?",
  say:"Llevo toda la mañana aquí con estas carpetas. El director está de vacaciones y nadie más puede firmar. Si no pagamos hoy, perdemos el descuento del 2 %.",
  sol:[{t:"Delegar la aprobación durante ausencias, con topes por monto y alerta a las 48 horas.",r:"¡Eso! Con un delegado firmamos hoy mismo y no perdemos el descuento."},
       {t:"Contratar otra persona para que también espere las firmas.",r:"Seríamos dos esperando... y las facturas seguirían quietas."},
       {t:"Pagar las facturas sin ninguna aprobación para no perder tiempo.",r:"¡Eso nos deja sin control! Auditoría jamás lo aceptaría."}]},
 I:{name:"Andrés",role:"Auxiliar de radicación",short:"¡No doy abasto con tanta factura!",
  say:"¡No doy abasto! Me llegan facturas por correo, en físico y hasta por WhatsApp. Ya ni sé cuál es la más antigua y no se puede ni caminar.",
  sol:[{t:"Radicar todos los días con meta de cero facturas de más de 48 horas y un tablero visible del pendiente.",r:"Con una meta diaria y el tablero sabría qué atender primero. Me sirve."},
       {t:"Comprar más archivadores para guardar las facturas.",r:"Así solo escondemos la montaña; el pendiente seguiría creciendo."},
       {t:"Radicar una vez al mes todo junto para ahorrar tiempo.",r:"¿Una vez al mes? La pila sería el doble de alta."}]},
 T:{name:"Don Hernán",role:"Mensajería interna",short:"Cuarta vuelta con las mismas carpetas...",
  say:"Hoy ya voy en la cuarta vuelta con las mismas carpetas: radicación, compras, contabilidad, auditoría... y otra vez. Y si se pierde una, me echan la culpa a mí.",
  sol:[{t:"Radicar digitalmente una sola vez y hacer las aprobaciones dentro del ERP.",r:"Entonces las carpetas no tendrían que viajar. Por fin podría ayudar en otra cosa."},
       {t:"Darle al mensajero un carrito más rápido.",r:"Llegaría antes, pero daría exactamente las mismas cuatro vueltas."},
       {t:"Contratar un segundo mensajero.",r:"Duplicamos el costo del recorrido, no lo eliminamos."}]},
 D:{name:"Paola",role:"Auxiliar contable",short:"¡Otra vez reversando!",
  say:"Otra vez me devolvieron tres comprobantes por la retención en la fuente. Tengo que reversarlos y causarlos de nuevo. ¡Esto no se acaba nunca!",
  sol:[{t:"Parametrizar la tarifa de retención por proveedor y concepto en el ERP y usar lista de chequeo.",r:"Si el sistema trae la tarifa correcta, ya no me equivoco al digitarla. ¡Gracias!"},
       {t:"Revisar todo dos veces al final del mes.",r:"Encontraríamos el error tarde y reversaríamos igual."},
       {t:"Pedirle a Paola que tenga más cuidado.",r:"Ya tengo cuidado... Sin un estándar, el error vuelve a pasar."}]},
 S:{name:"Diana",role:"Analista de conciliación",short:"2.400 movimientos a mano...",
  say:"Descargo el extracto del banco, lo imprimo y lo vuelvo a digitar en Excel para cruzarlo. Son 2.400 movimientos al mes y la impresora no para.",
  sol:[{t:"Importar el extracto en formato plano al ERP y conciliar con reglas automáticas.",r:"¡Me ahorraría días enteros! Y sin errores de digitación."},
       {t:"Comprar una impresora más rápida.",r:"Imprimiría más rápido algo que no hace falta imprimir."},
       {t:"Repartir la digitación entre dos personas.",r:"Seríamos dos haciendo un paso que sobra."}]},
 P:{name:"Gerente Ramírez",role:"Gerencia financiera",short:"Yo solo necesito una cifra...",
  say:"Cada mañana me dejan 25 páginas. Yo solo necesito saber cuánta caja tenemos y qué pagos vencen esta semana. Lo demás termina en la papelera.",
  sol:[{t:"Acordar con la gerencia un tablero de una página con el saldo y las alertas que sí usa.",r:"Perfecto. Una página clara y el equipo recupera 40 horas al mes."},
       {t:"Enviar el mismo informe por correo en lugar de imprimirlo.",r:"Ahorramos papel, pero seguimos haciendo 24 páginas que nadie lee."},
       {t:"Hacer el informe más detallado para que sea más útil.",r:"¿Más largo? No, por favor."}]},
 M:{name:"Carlos",role:"Contador",short:"¡Vuelta número 12 a la impresora!",
  say:"¡Uf! Esta es mi vuelta número 12 a la impresora del fondo, y todavía tengo que ir al archivo a buscar el comprobante del mes pasado.",
  sol:[{t:"Tener los soportes digitales consultables desde el puesto y acercar lo de uso frecuente.",r:"¡Sin caminar 1,2 km al día! Así me puedo concentrar en el cierre."},
       {t:"Comprarle zapatos más cómodos al contador.",r:"Muy amable, pero igual camino 1,2 km al día."},

function animHuman(h,dt,speed,mode="walk"){
  h.phase+=dt*(mode==="walk"?speed*1.6:5);
  const L=h.lLeg.rotation,R=h.rLeg.rotation,LA=h.lArm.rotation,RA=h.rArm.rotation;
  if(mode==="walk"){const a=Math.sin(h.phase)*Math.min(0.7,speed*0.12);L.x=a;R.x=-a;LA.x=-a;RA.x=a;}
  else if(mode==="type"){L.x=R.x=-1.45;LA.x=-1.15+Math.sin(h.phase*2)*0.08;RA.x=-1.15+Math.cos(h.phase*2)*0.08;}
  else if(mode==="sit"){L.x=R.x=-1.45;LA.x=RA.x=-0.6;}
  else if(mode==="hold"){L.x=R.x=0;LA.x=RA.x=-0.9;}
  else{L.x=R.x=0;LA.x=RA.x=Math.sin(h.phase*0.3)*0.04;}
}

    if(d2<r*r){if(d2>1e-8){const d=Math.sqrt(d2);p.x=cx+dx/d*r;p.z=cz+dz/d*r;}
      else{const o=[[b.minX-r-p.x,0],[b.maxX+r-p.x,0],[0,b.minZ-r-p.z],[0,b.maxZ+r-p.z]].sort((a,c)=>Math.abs(a[0]+a[1])-Math.abs(c[0]+c[1]));p.x+=o[0][0];p.z+=o[0][1];}}}

function follow(obj,path,st,speed,dt,stops,waitT=1.6){
  if(st.wait>0){st.wait-=dt;return false;}
  const a=path[st.seg],b=path[(st.seg+1)%path.length],len=Math.max(0.01,Math.hypot(b[0]-a[0],b[1]-a[1]));
  st.t+=speed*dt/len;
  if(st.t>=1){st.t=0;st.seg=(st.seg+1)%path.length;if(stops.has(st.seg))st.wait=waitT;}
  const p=path[st.seg],q=path[(st.seg+1)%path.length];
  obj.position.set(p[0]+(q[0]-p[0])*st.t,0,p[1]+(q[1]-p[1])*st.t);
  if(q[0]!==p[0]||q[1]!==p[1])obj.rotation.y=Math.atan2(q[0]-p[0],q[1]-p[1]);
  return true;
}

  if(toastT>0){toastT-=dt;if(toastT<=0)$("toast").hidden=true;}
  miniT-=dt;if(miniT<=0){drawMini();miniT=0.1;}
  renderer.render(scene,camera);requestAnimationFrame(loop);
}

/* ---------- Pantallas ---------- */
function startScreen(){
  $("screen").hidden=false;
  $("screen").innerHTML=`<div class="box card">
    <p class="eyebrow">Lean en procesos administrativos y financieros</p>
    <h1>Oficina Financiera de las <span>Mudas</span></h1>
    <p class="muted">Eres auditor de mejora continua. Recorre el área de contabilidad y tesorería, observa cómo fluyen (o se atascan) las facturas y encuentra los 8 puestos marcados con un anillo amarillo. En cada puesto alguien te contará su problema: primero identifica la muda y después propónle una solución. Cuida la satisfacción del equipo y de los proveedores, y mira la pantalla de indicadores al fondo.</p>
    <div class="grid8">${MUDAS.map(m=>`<div><b>${m.name}</b>${m.def}</div>`).join("")}</div>
    <label class="field" for="pname">Nombre del estudiante o grupo<input type="text" id="pname" placeholder="Ej.: Grupo 4 – Finanzas" value="${esc(G.player)}"${window.GATE_NAME?" readonly":""}></label>${window.GATE_NAME?`<p class="muted" style="font-size:.85rem">Acceso aprobado por el docente para ${esc(window.GATE_NAME)}.</p>`:""}
    <p class="keys">Muévete con <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> o las flechas (en celular, con el joystick). <kbd>E</kbd> audita el puesto, <kbd>1</kbd>–<kbd>8</kbd> responde, rueda del mouse o <kbd>+</kbd>/<kbd>−</kbd> para el zoom.</p>
    <div class="row"><button class="btn" id="startBtn">Entrar a la oficina</button></div></div>`;
  $("startBtn").onclick=()=>{G.player=$("pname").value.trim();$("screen").hidden=true;G.started=true;G.startedAt=new Date();toast("Busca los anillos amarillos. Sigue al mensajero y mira la pantalla de indicadores.");};
}
/* Nombre fijado por el control de acceso (solo en la versión con aprobación) */
window.onGateApproved=name=>{G.player=name;if(!G.started&&!G.ended)startScreen();};
function endGame(){
  G.ended=true;$("inspect").hidden=true;
  const s=score(),nota=(s/160*5).toFixed(1),okM=STATIONS.filter(st=>(G.results[st.muda]||{}).ok).length,okS=STATIONS.filter(st=>(G.results[st.muda]||{}).solOk).length,early=!allDone();
  const miss=STATIONS.filter(st=>!(G.results[st.muda]||{}).ok||!(G.results[st.muda]||{}).solOk);
  const mark=b=>`<span style="color:var(--${b?"ok":"bad"})">${b?"Acertó":"Falló"}</span>`,none=`<span class="muted">Sin responder</span>`;
  $("screen").hidden=false;
  $("screen").innerHTML=`<div class="box card">
    <p class="eyebrow">Auditoría terminada${G.player?" · "+esc(G.player):""}</p>
    <h1>Informe de <span>hallazgos</span></h1>
    ${early?`<p class="hint">Saliste antes de terminar: completaste ${doneCount()} de 8 puestos. Los puestos sin responder cuentan 0 puntos.</p>`:""}
    <div class="scoreRow">
      <div><p class="muted">Nota</p><p class="big">${nota}<small> / 5,0</small></p></div>
      <div><p class="muted">Puntos</p><p class="big" style="font-size:2rem">${s}<small> / 160</small></p></div>
      <div><p class="muted">Mudas</p><p class="big" style="font-size:2rem">${okM}<small> de 8</small></p></div>
      <div><p class="muted">Soluciones</p><p class="big" style="font-size:2rem">${okS}<small> de 8</small></p></div>
      <div><p class="muted">Satisfacción</p><p class="big" style="font-size:2rem">${Math.round(G.sat)}<small> %</small></p></div>
      <div><p class="muted">Tiempo</p><p class="big" style="font-size:2rem">${fmt(G.elapsed)}</p></div>
    </div>
    <div class="tablewrap"><table><thead><tr><th>Puesto</th><th>Persona</th><th>Muda</th><th>Tu respuesta</th><th>Solución</th></tr></thead><tbody>
    ${STATIONS.map(st=>{const r=G.results[st.muda];return `<tr><td>${esc(st.zone)}</td><td>${esc(TALK[st.muda].name)}</td><td>${mudaById(st.muda).name}</td><td>${!r?none:mark(r.ok)+(r.ok?"":" ("+mudaById(r.picked).name+")")}</td><td>${!r||r.sol==null?none:mark(r.solOk)}</td></tr>`;}).join("")}
    </tbody></table></div>
    ${miss.length?`<div style="display:grid;gap:8px"><h3>Para repasar</h3>${miss.map(m=>`<p class="muted"><b style="color:var(--ink)">${esc(m.zone)}:</b> ${esc(m.why)} <i>Solución:</i> ${esc(TALK[m.muda].sol[0].t)}</p>`).join("")}</div>`:""}
    <p class="muted" style="font-size:.85rem" id="dlMsg">Descarga el detalle de tu calificación (se abre en Excel) para entregarlo al docente.</p>
    <div class="row"><button class="btn" id="dlBtn" disabled>Preparando descarga…</button><button class="btn ghost" id="homeBtn">Volver al inicio</button><button class="btn ghost" id="again">Auditar de nuevo</button></div></div>`;
  $("again").onclick=restart;$("homeBtn").onclick=goHome;
  setupDownload();
}

/* ---------- Descarga del detalle de calificación ---------- */
const GAME_NAME="Oficina Financiera";
function csvCell(v){v=v==null?"":String(v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
const dec=n=>String(n).replace(".",",");
const two=n=>String(n).padStart(2,"0");
const fdate=d=>d?`${d.getFullYear()}-${two(d.getMonth()+1)}-${two(d.getDate())}`:"";
const ftime=d=>d?`${two(d.getHours())}:${two(d.getMinutes())}:${two(d.getSeconds())}`:"";
function buildCSV(){
  const end=new Date(),s=score(),nota=(s/160*5).toFixed(1);
  const okM=STATIONS.filter(st=>G.results[st.muda]&&G.results[st.muda].ok).length;
  const okS=STATIONS.filter(st=>G.results[st.muda]&&G.results[st.muda].solOk).length;
  const L=[];const row=a=>L.push(a.map(csvCell).join(";"));
  row(["DETALLE DE CALIFICACIÓN",GAME_NAME]);
  row(["Estudiante o grupo",G.player||"Sin nombre"]);
  row(["Fecha",fdate(G.startedAt||end)]);
  row(["Hora de inicio",ftime(G.startedAt)]);
  row(["Hora de finalización",ftime(end)]);
  row(["Duración (mm:ss)",fmt(G.elapsed)]);
  row(["Estado",allDone()?"Recorrido completo":"Salió antes de terminar ("+doneCount()+" de 8 puestos)"]);
  row(["Nota (0 a 5)",dec(nota)]);
  row(["Puntos",s+" de 160"]);
  row(["Mudas identificadas",okM+" de 8"]);
  row(["Soluciones correctas",okS+" de 8"]);
  row(["Satisfacción final (%)",Math.round(G.sat)]);
  row(["Puntaje","Muda: 10 pts (7 con pista) · Solución: 10 pts"]);
  row([]);
  row(["N.° orden","Puesto o zona","Persona","Situación","Muda correcta","Respuesta del estudiante","¿Acertó muda?","¿Usó pista?","Puntos muda","Solución elegida","Solución correcta","¿Acertó solución?","Puntos solución","Puntos totales","Momento de respuesta (mm:ss)","Explicación"]);
  STATIONS.map(st=>({st,r:G.results[st.muda]})).sort((a,b)=>((a.r&&a.r.order)||99)-((b.r&&b.r.order)||99)).forEach(({st,r})=>{
    const T=TALK[st.muda];
    if(!r){row(["—",st.zone,T.name,st.title,mudaById(st.muda).name,"Sin responder","No","",0,"",T.sol[0].t,"No",0,0,"",st.why]);return;}
    const pm=r.ok?(r.hint?7:10):0,ps=r.solOk?10:0;
    row([r.order,st.zone,T.name,st.title,mudaById(st.muda).name,mudaById(r.picked).name,r.ok?"Sí":"No",r.hint?"Sí":"No",pm,
         r.sol!=null?T.sol[r.sol].t:"Sin responder",T.sol[0].t,r.solOk?"Sí":"No",ps,pm+ps,fmt(r.tSol!=null?r.tSol:r.tMuda),st.why]);
  });
  return "﻿"+L.join("\r\n");
}
function fileName(){
  const who=(G.player||"estudiante").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,40)||"estudiante";
  const d=G.startedAt||new Date();
  return `calificacion_${GAME_NAME.toLowerCase().replace(/[^a-z0-9]+/g,"_")}_${who}_${fdate(d)}_${two(d.getHours())}${two(d.getMinutes())}.csv`;
}
let downloadsNS;
const dlReady=(async()=>{try{downloadsNS=window.claude&&window.claude.use?await window.claude.use("downloads"):null;}catch(e){downloadsNS=null;}return downloadsNS;})();
async function setupDownload(){
  const btn=$("dlBtn"),msg=$("dlMsg");if(!btn)return;
  const ns=await dlReady;
  if(!$("dlBtn"))return;
  if(ns){
    btn.disabled=false;btn.textContent="Descargar calificación (Excel)";
    btn.onclick=async()=>{
      btn.disabled=true;
      try{await ns.save({filename:fileName(),data:buildCSV()});msg.textContent="Archivo descargado. Entrégalo al docente.";btn.textContent="Descargar de nuevo";}
      catch(e){const c=e&&e.code;
        if(c==="declined")msg.textContent="Cancelaste la descarga. Puedes intentarlo de nuevo.";
        else if(c==="rate_limited")msg.textContent="Ya hay una descarga pendiente de confirmar. Espera un momento.";
        else{msg.textContent="La descarga no está disponible aquí. Usa el botón para copiar el detalle y pégalo en Excel.";useCopy(btn,msg);return;}
      }
      btn.disabled=false;
    };
  }else if(!window.claude)useFileDownload(btn,msg);
  else useCopy(btn,msg);
}
function useFileDownload(btn,msg){
  btn.disabled=false;btn.textContent="Descargar calificación (Excel)";
  btn.onclick=()=>{
    try{
      const url=URL.createObjectURL(new Blob([buildCSV()],{type:"text/csv;charset=utf-8"}));
      const a=document.createElement("a");a.href=url;a.download=fileName();document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      msg.textContent="Archivo descargado. Entrégalo al docente.";btn.textContent="Descargar de nuevo";
    }catch(e){useCopy(btn,msg);}
  };
}
function useCopy(btn,msg){
  btn.disabled=false;btn.textContent="Copiar detalle para Excel";
  msg.textContent="La descarga no está disponible en este navegador. Copia el detalle y pégalo en una hoja de Excel.";
  btn.onclick=async()=>{
    const tsv=buildCSV().replace(/^﻿/,"").split("\r\n").map(l=>l.replace(/;/g,"\t")).join("\n");
    try{await navigator.clipboard.writeText(tsv);msg.textContent="Detalle copiado. Pégalo en Excel con Ctrl+V.";}
    catch(e){let ta=$("dlText");if(!ta){ta=document.createElement("textarea");ta.id="dlText";ta.readOnly=true;ta.style.cssText="width:100%;height:140px;font:12px var(--f-mono);background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px";msg.after(ta);}
      ta.value=tsv;ta.focus();ta.select();msg.textContent="Selecciona el texto (ya está marcado), cópialo y pégalo en Excel.";}
  };
}


/* ---------- Salir ---------- */
function restart(){G.results={};G.ended=false;G.elapsed=0;G.sat=50;STATIONS.forEach(s=>{s.prompted=false;s.order=null;s.ring.material.color.setHex(0xf2b705);s.gem.material.color.setHex(0xf2b705);s.gem.material.emissive.setHex(0x5a4200);});player.pos.set(0,0,4.5);camT.copy(player.pos);updateHUD();$("screen").hidden=true;G.started=true;G.startedAt=new Date();}
function goHome(){restart();G.started=false;startScreen();}
function askExit(){
  if(!G.started||G.ended)return;
  if(G.open!==null){$("sheet").hidden=true;G.open=null;}
  G.started=false;$("inspect").hidden=true;
  const n=doneCount();
  $("screen").hidden=false;
  $("screen").innerHTML=`<div class="box card" role="dialog" aria-labelledby="exitTitle">
    <p class="eyebrow">Recorrido en pausa</p>
    <h1 id="exitTitle" style="font-size:clamp(1.6rem,5vw,2.2rem)">¿Quieres <span>salir</span>?</h1>
    <p class="muted">Llevas ${n} de 8 puestos completos y ${score()} puntos. Si terminas ahora, los puestos sin responder cuentan 0 puntos.</p>
    <div class="row">
      <button class="btn" id="exFinish">Terminar y ver mi calificación</button>
      <button class="btn ghost" id="exHome">Salir sin calificación (volver al inicio)</button>
      <button class="btn ghost" id="exStay">Seguir jugando</button>
    </div></div>`;
  $("exFinish").onclick=()=>{G.started=true;endGame();};
  $("exHome").onclick=goHome;
  $("exStay").onclick=()=>{$("screen").hidden=true;G.started=true;};
  $("exStay").focus();
}
$("exitBtn").onclick=askExit;

updateHUD();startScreen();loop();
</script>
